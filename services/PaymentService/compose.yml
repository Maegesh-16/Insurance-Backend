services:
  payment-service:
    build:
      context: .
      dockerfile: Containerfile
    container_name: payment-service
    ports:
      - "7002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__PaymentDb: ${PAYMENT_CONNECTION_STRING:-Server=host.docker.internal,1433;Database=payment_db;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False}
      Jwt__Issuer: ${JWT_ISSUER:-Insurance.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Insurance.Services}
      Jwt__Key: ${JWT_KEY:-DevelopmentOnlyChangeThisJwtSigningKey123!}
