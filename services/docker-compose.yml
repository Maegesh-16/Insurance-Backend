services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: insurance-sqlserver
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: insurance-sql-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./sqlserver/create-databases.sql:/scripts/create-databases.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /scripts/create-databases.sql"]

  premium-service:
    build:
      context: ./PremiumService
      dockerfile: Containerfile
    container_name: premium-service
    depends_on:
      sql-init:
        condition: service_completed_successfully
    ports:
      - "7001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PremiumDb: Server=sqlserver,1433;Database=premium_db;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False
      Jwt__Issuer: ${JWT_ISSUER:-Insurance.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Insurance.Services}
      Jwt__Key: ${JWT_KEY:-DevelopmentOnlyChangeThisJwtSigningKey123!}

  payment-service:
    build:
      context: ./PaymentService
      dockerfile: Containerfile
    container_name: payment-service
    depends_on:
      sql-init:
        condition: service_completed_successfully
    ports:
      - "7002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentDb: Server=sqlserver,1433;Database=payment_db;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False
      Jwt__Issuer: ${JWT_ISSUER:-Insurance.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Insurance.Services}
      Jwt__Key: ${JWT_KEY:-DevelopmentOnlyChangeThisJwtSigningKey123!}

  notification-service:
    build:
      context: ./NotificationService
      dockerfile: Containerfile
    container_name: notification-service
    depends_on:
      sql-init:
        condition: service_completed_successfully
    ports:
      - "7003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: Server=sqlserver,1433;Database=notification_db;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False
      Jwt__Issuer: ${JWT_ISSUER:-Insurance.Identity}
      Jwt__Audience: ${JWT_AUDIENCE:-Insurance.Services}
      Jwt__Key: ${JWT_KEY:-DevelopmentOnlyChangeThisJwtSigningKey123!}

volumes:
  sqlserver-data: